<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Gmail Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gmail <span>Checker</span></h1>
            <p>Cek apakah sebuah alamat email aktif, valid, atau palsu.</p>
        </div>

        <div class="input-group">
            <input type="email" id="emailInput" placeholder="Masukkan alamat email (contoh: budi@gmail.com)" required>
            <button id="checkBtn" onclick="checkEmail()">Cek Email</button>
        </div>

        <div id="loading" class="hidden">
            <div class="spinner"></div>
            <p>Mengecek ke server email...</p>
        </div>

        <div id="resultBox" class="result-box hidden">
            <h3 id="resultStatus">Status</h3>
            <p id="resultDetail">Detail akan muncul di sini.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
